# Les tests sur les deux familles de systèmes. Windows d'abord : les collègues
# visés y sont, et rien n'y avait jamais tourné avant le 14 septembre 2026.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Node 22 : `node --test "tests/*.test.js"` s'appuie sur les globs de
      # `node --test`, que Node 20 n'a pas — et que cmd.exe ne développe pas.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
